name: CI - Laravel Tests

on:
  push:
    branches: [ main, devops/cicd ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: hras
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 --silent; then
              echo "MySQL is ready!"
              exit 0
            fi
            echo "Waiting for MySQL ($i/30)..."
            sleep 3
          done
          echo "MySQL did not become ready in time." >&2
          exit 1

      - name: Run migrations and seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hras
          DB_USERNAME: root
          DB_PASSWORD: ""
          APP_ENV: testing
          APP_DEBUG: 1
          SESSION_DRIVER: array
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --seed --force

      - name: Run tests (debug)
        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: hras
            DB_USERNAME: root
            DB_PASSWORD: ""
            APP_ENV: testing
            APP_DEBUG: 1
            SESSION_DRIVER: array
            CACHE_DRIVER: array
            QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit --configuration phpunit.xml --debug

