server {
    listen 80;

    server_name localhost;
    root /var/www/public;

    index index.php index.html;

    # Serve static files or route to Laravel index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling via PHP-FPM (TCP to app container)
    location ~ \.php$ {
        include fastcgi_params;

        # Connect to PHP-FPM in app container
        fastcgi_pass hras_app:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Recommended for Laravel
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to .htaccess and hidden files
    location ~ /\. {
        deny all;
    }

    # Optional: increase client max body size for uploads
    client_max_body_size 50M;

    # Optional: gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
