services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: hras_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www/app:cached
      - ./routes:/var/www/routes:cached
    env_file:
      - .env.local
    depends_on:
      - db
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint.local.sh"]

  db:
    image: mysql:8.0
    container_name: hras_db
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init-main.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nginx:
    image: nginx:stable
    container_name: hras_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:cached
      - ./docker/nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db_data:
